name: Fantasy stats bot

on:
  schedule:
    # Tuesdays 10:17 UTC, September through February (after Monday Night Football).
    - cron: "17 10 * 1,2,9-12 2"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download every season (ignore cache)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: fantasy-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r fantasy-data/bot/requirements.txt

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: fantasy-data/.cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Run bot
        run: python fantasy-data/bot/fetch_stats.py ${{ inputs.force && '--force' || '' }}

      - name: Commit updated data
        id: commit
        run: |
          git add fantasy-data/data
          if git diff --cached --quiet -- fantasy-data/data ':!fantasy-data/data/meta.json'; then
            echo "No stat changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "fantasy-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fantasy stats data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so kick
      # the Pages deploy explicitly.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
