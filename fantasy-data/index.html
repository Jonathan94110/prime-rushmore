<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decade Top 100</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --bg: #060504;
        --panel: rgba(18, 14, 11, 0.9);
        --panel-strong: #1a1410;
        --ink: #eef6fa;
        --muted: #8f887e;
        --line: rgba(255, 165, 0, 0.12);
        --gold: #ffa500;
        --cyan: #00f0ff;
        --row-hover: rgba(0, 240, 255, 0.05);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 0%, rgba(0, 240, 255, 0.07), transparent 40%),
          radial-gradient(circle at 10% 100%, rgba(255, 165, 0, 0.07), transparent 40%),
          var(--bg);
        font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 64px; }
      h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
      h1 span { color: var(--gold); }
      header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      header.top a { color: var(--cyan); }
      .sub { color: var(--muted); margin: 6px 0 22px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 7px 14px;
        border-radius: 999px;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .chip:hover { border-color: rgba(0, 240, 255, 0.4); }
      .chip[aria-pressed="true"] { background: var(--gold); color: #140d02; border-color: var(--gold); font-weight: 600; }
      .chip.pos[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: #001417; }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
      input[type="search"], select {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        padding: 8px 12px;
        border-radius: 10px;
        min-width: 0;
      }
      input[type="search"] { flex: 1 1 220px; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
      th { position: sticky; top: 0; background: var(--panel-strong); color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
      th.l, td.l { text-align: left; }
      tbody tr.main { cursor: pointer; }
      tbody tr.main:hover { background: var(--row-hover); }
      td.rank { color: var(--muted); width: 3ch; }
      td.name { font-weight: 600; }
      td.name small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; }
      td.fp { color: var(--gold); font-weight: 800; }
      .head { display: inline-flex; align-items: center; gap: 10px; }
      .head img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #222; }
      tr.detail > td { background: rgba(0, 0, 0, 0.35); padding: 0 0 6px; }
      tr.detail table { font-size: 0.82rem; }
      tr.detail th { position: static; background: transparent; }
      .notes { color: var(--muted); font-size: 0.85rem; margin-top: 18px; line-height: 1.5; }
      .notes li { margin-bottom: 4px; }
      .empty { padding: 28px; text-align: center; color: var(--muted); }
      @media (max-width: 640px) {
        th, td { padding: 8px 7px; }
        .head img { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="top">
        <h1>Decade <span>Top 100</span></h1>
        <a href="./bot.html">Run the bot →</a>
      </header>
      <p class="sub" id="sub">Loading…</p>

      <div class="bar" id="decades" role="group" aria-label="Decade"></div>
      <div class="bar" id="positions" role="group" aria-label="Position"></div>

      <div class="tools">
        <input type="search" id="search" placeholder="Search player or team" aria-label="Search" />
        <select id="format" aria-label="Scoring format">
          <option value="fp_ppr">PPR</option>
          <option value="fp_half_ppr">Half PPR</option>
          <option value="fp_standard">Standard</option>
        </select>
      </div>

      <div class="table-wrap"><table id="table"></table></div>
      <ul class="notes" id="notes"></ul>
    </main>

    <script>
      const BASE = "data/top100/";
      const POSITIONS = ["QB", "RB", "WR", "K", "DEF"];
      const OFFENSE = ["QB", "RB", "WR"];

      const n = v => (v == null ? "–" : Number(v).toLocaleString());
      const f1 = v => (v == null ? "–" : Number(v).toFixed(1));
      const COLUMNS = {
        QB: [["Cmp/Att", r => `${n(r.completions)}/${n(r.attempts)}`], ["Pass Yds", r => n(r.passing_yards)], ["Pass TD", r => n(r.passing_tds)], ["INT", r => n(r.interceptions)], ["Rush Yds", r => n(r.rushing_yards)], ["Rush TD", r => n(r.rushing_tds)]],
        RB: [["Car", r => n(r.carries)], ["Rush Yds", r => n(r.rushing_yards)], ["Rush TD", r => n(r.rushing_tds)], ["Rec", r => n(r.receptions)], ["Rec Yds", r => n(r.receiving_yards)], ["Rec TD", r => n(r.receiving_tds)]],
        WR: [["Rec", r => n(r.receptions)], ["Rec Yds", r => n(r.receiving_yards)], ["Rec TD", r => n(r.receiving_tds)], ["Rush Yds", r => n(r.rushing_yards)], ["Rush TD", r => n(r.rushing_tds)]],
        K: [["FGM/FGA", r => `${n(r.fg_made)}/${n(r.fg_att)}`], ["40-49", r => n(r.fg_made_40_49)], ["50+", r => n(r.fg_made_50_plus)], ["XPM/XPA", r => `${n(r.xp_made)}/${n(r.xp_att)}`]],
        DEF: [["Pts Allowed", r => n(r.points_allowed)], ["Sacks", r => n(r.sacks)], ["INT", r => n(r.interceptions)], ["Fum Rec", r => n(r.fumble_recoveries)], ["TD", r => n((r.def_tds || 0) + (r.st_tds || 0))], ["Safety", r => n(r.safeties)], ["Blocks", r => n(r.blocked_kicks)]],
      };

      const state = { index: null, decade: null, pos: "QB", cache: {}, format: "fp_ppr", query: "", open: new Set() };
      try {
        const saved = JSON.parse(localStorage.getItem("top100-view") || "{}");
        Object.assign(state, { pos: saved.pos || state.pos, format: saved.format || state.format, decade: saved.decade || null });
      } catch (e) {}
      const remember = () => { try { localStorage.setItem("top100-view", JSON.stringify({ pos: state.pos, format: state.format, decade: state.decade })); } catch (e) {} };

      const el = id => document.getElementById(id);
      const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      async function load(decade) {
        if (!state.cache[decade]) state.cache[decade] = await (await fetch(`${BASE}${decade}.json`)).json();
        return state.cache[decade];
      }

      function chips(container, items, current, cls, onPick) {
        container.innerHTML = items.map(([value, label]) =>
          `<button class="chip ${cls}" type="button" data-v="${esc(value)}" aria-pressed="${value === current}">${esc(label)}</button>`).join("");
        container.onclick = e => { const b = e.target.closest("button"); if (b) onPick(b.dataset.v); };
      }

      function rowsFor(data) {
        let rows = (data.positions[state.pos] || []).slice();
        if (OFFENSE.includes(state.pos)) {
          rows.sort((a, b) => b[state.format] - a[state.format]);
          rows = rows.map((r, i) => ({ ...r, _rank: i + 1, _fp: r[state.format], _fpg: r.games ? r[state.format] / r.games : null }));
        } else {
          rows = rows.map(r => ({ ...r, _rank: r.rank, _fp: r.fp, _fpg: r.fp_per_game }));
        }
        const q = state.query.trim().toLowerCase();
        if (q) rows = rows.filter(r => `${r.name || r.team_name} ${r.teams || r.team} ${r.season || ""}`.toLowerCase().includes(q));
        return rows;
      }

      function seasonTable(r) {
        const cols = COLUMNS[state.pos];
        const fpKey = OFFENSE.includes(state.pos) ? state.format : "fp";
        const lines = r.season_lines.map(s => `<tr><td class="l">${s.season}</td><td class="l">${esc(s.team)}</td><td>${n(s.games)}</td>${cols.map(([, fn]) => `<td>${fn(s)}</td>`).join("")}<td class="fp">${f1(s[fpKey])}</td></tr>`).join("");
        return `<table><thead><tr><th class="l">Season</th><th class="l">Team</th><th>G</th>${cols.map(([h]) => `<th>${h}</th>`).join("")}<th>FP</th></tr></thead><tbody>${lines}</tbody></table>`;
      }

      async function render() {
        const data = await load(state.decade);
        const cols = COLUMNS[state.pos];
        const isDef = state.pos === "DEF";
        const rows = rowsFor(data);
        const span = cols.length + 6;
        const head = `<thead><tr><th>#</th><th class="l">${isDef ? "Defense" : "Player"}</th><th class="l">${isDef ? "Season" : "Years"}</th><th>G</th>${cols.map(([h]) => `<th>${h}</th>`).join("")}<th>FP</th><th>FP/G</th></tr></thead>`;
        const body = rows.map(r => {
          const id = r.id;
          const who = isDef
            ? `<td class="l name">${esc(r.team_name)}<small>${esc(r.team)}</small></td><td class="l">${r.season}</td>`
            : `<td class="l name"><span class="head">${r.headshot_url ? `<img src="${esc(r.headshot_url)}" alt="" loading="lazy">` : ""}<span>${esc(r.name)}<small>${esc(r.teams)}${r.best_season ? ` · best ${r.best_season}` : ""}</small></span></span></td><td class="l">${r.first_season}${r.last_season !== r.first_season ? `–${String(r.last_season).slice(2)}` : ""}</td>`;
          const main = `<tr class="main" data-id="${esc(id)}"><td class="rank">${r._rank}</td>${who}<td>${n(r.games)}</td>${cols.map(([, fn]) => `<td>${fn(r)}</td>`).join("")}<td class="fp">${f1(r._fp)}</td><td>${f1(r._fpg)}</td></tr>`;
          const detail = !isDef && state.open.has(id) ? `<tr class="detail"><td colspan="${span}">${seasonTable(r)}</td></tr>` : "";
          return main + detail;
        }).join("");
        el("table").innerHTML = head + `<tbody>${body || `<tr><td class="empty" colspan="${span}">No ${state.pos} data for the ${state.decade}.</td></tr>`}</tbody>`;
        el("format").disabled = !OFFENSE.includes(state.pos);
        el("sub").textContent = `${data.seasons[0]}–${data.seasons[1]} · ranked by regular-season fantasy points in the decade${isDef ? " (team-seasons)" : ". Click a player for season lines."}`;
      }

      function drawControls() {
        chips(el("decades"), state.index.decades.map(d => [d.decade, d.decade]), state.decade, "", v => { state.decade = v; state.open.clear(); remember(); drawControls(); render(); });
        const counts = state.index.decades.find(d => d.decade === state.decade).counts;
        chips(el("positions"), POSITIONS.map(p => [p, `${p} ${counts[p] ? `(${counts[p]})` : ""}`]), state.pos, "pos", v => { state.pos = v; state.open.clear(); remember(); drawControls(); render(); });
      }

      el("table").addEventListener("click", e => {
        const tr = e.target.closest("tr.main");
        if (!tr || state.pos === "DEF") return;
        const id = tr.dataset.id;
        state.open.has(id) ? state.open.delete(id) : state.open.add(id);
        render();
      });
      el("search").addEventListener("input", e => { state.query = e.target.value; render(); });
      el("format").addEventListener("change", e => { state.format = e.target.value; remember(); render(); });

      (async () => {
        try {
          state.index = await (await fetch(`${BASE}index.json`)).json();
        } catch (e) {
          el("sub").textContent = "Couldn't load data/top100/index.json — run bot/fetch_stats.py first.";
          return;
        }
        const decades = state.index.decades.map(d => d.decade);
        if (!decades.includes(state.decade)) state.decade = decades[decades.length - 1];
        el("format").value = state.format;
        el("notes").innerHTML = state.index.coverage_notes.map(t => `<li>${esc(t)}</li>`).join("");
        drawControls();
        render();
      })();
    </script>
  </body>
</html>
